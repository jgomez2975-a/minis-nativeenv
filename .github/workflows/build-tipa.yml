name: build-tipa

# Builds Minis with the native runtime host grafted in and emits a .tipa.
#
# Why CI instead of a local build: this app cannot be produced off macOS.
# It targets iOS 26.2 / Swift 6, links iSH (meson + clang), FFmpeg (autotools +
# the Metal toolchain), rclone (Go static xcframework) and links several SwiftPM
# binary targets. There is no Windows or Linux path to that binary. The runner
# here is the build machine.
#
# Wall clock: ~35 min cold (native deps are the bulk), ~8 min warm with the
# deps cache. The job is well inside the 6h ceiling.

on:
  workflow_dispatch:
    inputs:
      mt_version:
        description: "MT-Agent helper payload version (1.0.5 and 1.0.6 are byte-identical)"
        required: false
        default: "1.0.5"
  push:
    branches: [main, nativeenv]
    # Anything the build actually consumes. The earlier list covered only
    # src/ios/RuntimeHost and this file, so a fix touching scripts/, patches/ or
    # entitlements/ pushed cleanly and then silently did not build.
    paths:
      - "src/ios/RuntimeHost/**"
      - "scripts/**"
      - "patches/**"
      - "verify/**"
      - "entitlements/**"
      - ".github/workflows/build-tipa.yml"

concurrency:
  group: build-tipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-26 ships Xcode 26 / iOS 26 SDK, which IPHONEOS_DEPLOYMENT_TARGET=26.2
    # requires. macos-latest is NOT enough 鈥?it may still resolve to 15.
    runs-on: macos-26
    timeout-minutes: 300

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Verify submodules
        run: |
          set -eu
          for d in deps/ish deps/proot; do
            if [ -z "$(ls -A "$d" 2>/dev/null)" ]; then
              echo "::error::$d is empty 鈥?submodule init failed"
              git submodule update --init --recursive "$d"
            fi
          done

      - name: Python tooling
        # A venv, not `pip install --user`. macOS runner images ship a
        # Homebrew-managed python3 that refuses system installs under PEP 668
        # ("externally-managed-environment"), so the first CI run died here
        # before preflight ever executed. venv also keeps meson off the
        # Homebrew prefix, which is what PEP 668 is protecting.
        run: |
          set -eu
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet --upgrade pip
          .venv/bin/python -m pip install --quiet \
            pyyaml tree_sitter tree_sitter_swift tree_sitter_c meson
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python -c "import yaml, tree_sitter, tree_sitter_swift, tree_sitter_c; print('python tooling ready')"
          .venv/bin/meson --version

      - name: Preflight
        # Everything checkable without Xcode, in ~20 s. Without this the first
        # Swift syntax error or plist typo surfaces 35 minutes into the native
        # dependency build.
        run: |
          set -eu
          python3 scripts/preflight.py --repo .
          echo "::notice::preflight passed"

      - name: Type-check the whole graft
        # Preflight proves the sources parse; only the compiler proves they type
        # check. This runs every graft file through swiftc with the real C
        # header bridged in and stubs for the two Minis types it touches.
        #
        # It exists because the first run found `Data().write(to:atomically:)` 鈥?        # an overload that does not exist 鈥?in RuntimeTar. xcodebuild would have
        # reported the same thing 35 minutes later, after building iSH, FFmpeg
        # and rclone.
        run: |
          set -euo pipefail
          # Foundation-only core, plus the iOS-only UI. The split is not
          # cosmetic: the host pass compiles for macOS, where
          # `navigationBarTitleDisplayMode` and `.topBarTrailing` do not exist,
          # so a single list fails on files that are correct for the target.
          CORE=(
            src/ios/RuntimeHost/RuntimePaths.swift
            src/ios/RuntimeHost/RuntimeManifest.swift
            src/ios/RuntimeHost/RuntimePlan.swift
            src/ios/RuntimeHost/RuntimeTar.swift
            src/ios/RuntimeHost/RuntimeInstaller.swift
            src/ios/RuntimeHost/NativeShellExecutor.swift
            src/ios/RuntimeHost/NativeShellBackend.swift
            src/ios/RuntimeHost/RuntimeEnvironmentBrief.swift
          )
          UI=(
            src/ios/RuntimeHost/RuntimeCatalog.swift
            src/ios/RuntimeHost/DevCapabilitiesView.swift
          )
          STUBS=(
            verify/stubs/AppLogger.swift
            verify/stubs/ISHCommandResult.swift
            verify/stubs/AppLocalized.swift
          )
          HDR=( -import-objc-header src/ios/RuntimeHost/RuntimeArchive.h )

          # Pass 1 鈥?host. Also the pass the verify binary is built from.
          swiftc -typecheck "${HDR[@]}" "${CORE[@]}" "${STUBS[@]}"
          echo "host type-check: ok (core)"

          # Pass 2 鈥?the real iOS SDK at the project's strictest deployment
          # target. Not redundant: posix_spawn's addchdir_np is merely
          # deprecated on macOS but explicitly unavailable on iOS, so a host-only
          # check passed while xcodebuild failed.
          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          swiftc -typecheck \
            -sdk "$IOS_SDK" \
            -target arm64-apple-ios16.0 \
            "${HDR[@]}" "${CORE[@]}" "${UI[@]}" "${STUBS[@]}"
          echo "::notice::graft type-checks for host (core) and for iOS (core + UI)"

      - name: Verify the decoder against the live documents
        # Compiles the Foundation-only files with the host swiftc and runs the
        # real JSONDecoder over the real manifest and descriptors. This is the
        # only check that exercises Swift's actual decoding rather than a
        # re-implementation of it, and it costs a few seconds.
        run: |
          set -euo pipefail
          # RuntimeArchive.c is what the app links for gzip. Compiling it here
          # means the install rehearsal below exercises the same decompressor
          # instead of a stand-in.
          clang -c -O2 -I src/ios/RuntimeHost \
            src/ios/RuntimeHost/RuntimeArchive.c -o /tmp/runtimearchive.o

          swiftc -O \
            -import-objc-header src/ios/RuntimeHost/RuntimeArchive.h \
            src/ios/RuntimeHost/RuntimeManifest.swift \
            src/ios/RuntimeHost/RuntimePlan.swift \
            src/ios/RuntimeHost/RuntimePaths.swift \
            src/ios/RuntimeHost/RuntimeTar.swift \
            verify/main.swift \
            /tmp/runtimearchive.o -lz \
            -o /tmp/verify-host
          echo "verify-host built"

          mkdir -p /tmp/docs
          curl -fsSL -o /tmp/docs/manifest.json \
            https://raw.githubusercontent.com/susu123oss/CodexApp-Runtime/main/Runtime/runtime-manifest.json
          # Descriptor URLs come from the manifest itself so a release bump does
          # not need a workflow edit.
          python3 - <<'PY'
          import json, subprocess
          m = json.load(open('/tmp/docs/manifest.json', encoding='utf-8-sig'))
          for key, spec in m['runtimes'].items():
              url = spec.get('metadata_url')
              if not url:
                  continue
              subprocess.run(['curl', '-fsSL', '-o', f'/tmp/docs/{key}.json', url], check=True)
              print(f'  fetched descriptor {key}')
          PY

          /tmp/verify-host plans /tmp/docs/manifest.json /tmp/docs

      - name: Verify the tar reader against a real payload
        # RuntimeTar is ~250 lines of hand-written binary parsing that nothing
        # else exercises. This runs it over the smallest published runtime and
        # diffs the result against ground truth produced by Python's tarfile.
        run: |
          set -eu
          ARCHIVE_URL="https://github.com/susu123oss/CodexApp-Runtime/releases/download/runtime-core-tools-d16eac405af9/CoreToolsRuntime.tar.gz"
          curl -fsSL -o /tmp/coretools.tar.gz "$ARCHIVE_URL"
          gzip -dc /tmp/coretools.tar.gz > /tmp/coretools.tar

          /tmp/verify-host tar /tmp/coretools.tar /tmp/tar-out > /tmp/tar-manifest.txt
          # The manifest JSON is everything up to the first blank line.
          python3 - <<'PY'
          import json, sys, pathlib
          raw = pathlib.Path('/tmp/tar-manifest.txt').read_text()
          head, _, tail = raw.partition('\n\n')
          got = json.loads(head)
          want = json.loads(pathlib.Path('verify/tar-fixture.json').read_text())

          print(tail.strip())

          gmap = {e['path']: e for e in got}
          wmap = {e['path']: e for e in want}
          problems = []
          for path in sorted(set(wmap) - set(gmap)):
              problems.append(f'missing: {path}')
          for path in sorted(set(gmap) - set(wmap)):
              problems.append(f'unexpected: {path}')
          for path in sorted(set(gmap) & set(wmap)):
              g, w = gmap[path], wmap[path]
              for field in ('kind', 'mode', 'size', 'link', 'sha256'):
                  if g.get(field) != w.get(field):
                      problems.append(f'{path}: {field} {g.get(field)!r} != {w.get(field)!r}')

          if problems:
              print(f'TAR FIXTURE MISMATCH ({len(problems)}):')
              for p in problems[:25]:
                  print('  *', p)
              sys.exit(1)
          print(f'OK 鈥?{len(got)} entries match the fixture exactly')
          PY

      - name: Rehearse a real install on the host
        # "It builds" and "it installs" are different claims, and only one of
        # them can be made from the compiler's output. This runs the actual
        # pipeline — download through the published proxies, verify the published
        # SHA-256, decompress with the linked C shim, extract with the real
        # TarReader, then assert that every path the plan requires exists — for
        # the two smallest runtimes.
        #
        # Signing and probing stay out of reach: they execute arm64 iOS binaries,
        # and this is macOS.
        run: |
          set -euo pipefail
          mkdir -p /tmp/install
          # theos and ollvm are included on purpose: they are the two
          # runtimes that turn the shell into a compiler (make, ldid and
          # dpkg-deb from Theos; clang from OLLVM), so "it can build on
          # device" is only a claim worth making if their archives
          # download, checksum and extract for real.
          for key in core_tools python theos ollvm; do
            echo "=== $key"
            /tmp/verify-host fetch /tmp/docs/manifest.json /tmp/docs /tmp/install "$key"
            rm -rf /tmp/install/root || true
            rm -f /tmp/install/*.tar /tmp/install/*.bin /tmp/install/*.gz || true
          done
          echo "::notice::install pipeline rehearsed end to end on the host"

      - name: Toolchain versions
        id: sdk
        run: |
          set -eu
          xcodebuild -version
          echo "--- installed SDKs ---"
          xcodebuild -showsdks || true
          swift --version
          # go arrives from brew in a later step; asking for it here exits 127
          # under `set -e`.
          command -v go >/dev/null 2>&1 && go version || echo "go: not installed yet (expected)"

          # The project pins IPHONEOS_DEPLOYMENT_TARGET = 26.2. A runner image
          # can carry Xcode 26 with an older point SDK (26.0/26.1), and then the
          # build dies immediately with "iOS 26.2 is not available". Rather than
          # fail, clamp the deployment target to the newest SDK actually
          # installed. Raising a lower target is harmless; asking for an SDK that
          # does not exist is fatal, so this only ever moves down.
          SDKVER=$(xcodebuild -showsdks 2>/dev/null \
            | sed -n 's/.*[Ss][Dd][Kk][Ss]* *iphoneos\([0-9][0-9.]*\).*/\1/p' \
            | sort -V | tail -1)
          NEEDED=$(grep -m1 'IPHONEOS_DEPLOYMENT_TARGET' src/ios/Minis.xcodeproj/project.pbxproj \
            | sed 's/.*= *//; s/;.*//' | tr -d ' ')
          echo "runner iOS SDK = ${SDKVER:-<none>}, project wants = ${NEEDED:-<none>}"

          if [ -n "${SDKVER:-}" ] && [ -n "${NEEDED:-}" ] && \
             [ "$(printf '%s\n%s\n' "$SDKVER" "$NEEDED" | sort -V | head -1)" != "$NEEDED" ]; then
            echo "::warning::iOS SDK $SDKVER is older than the project's $NEEDED 鈥?clamping deployment target to $SDKVER"
            echo "DEPLOYMENT_OVERRIDE=IPHONEOS_DEPLOYMENT_TARGET=$SDKVER" >> "$GITHUB_ENV"
          else
            echo "DEPLOYMENT_OVERRIDE=" >> "$GITHUB_ENV"
          fi

      - name: Build-time customization files
        run: |
          set -eu
          cp -n src/ios/Configs/ProviderCustomization.xcconfig.example \
                src/ios/Configs/ProviderCustomization.xcconfig || true
          cp -n src/android/app/provider-customization.properties.example \
                src/android/app/provider-customization.properties || true

      - name: Install build dependencies
        # meson arrives from the venv, not pip. Everything here is a native
        # build dependency the deps/ scripts call directly.
        #
        # `lld` is separate from `llvm` in Homebrew. iSH's VDSO step invokes
        # `clang -target aarch64-linux-gnu -fuse-ld=lld`, and without ld.lld
        # discoverable next to the clang that brew installed, clang fails with
        # "invalid linker name in argument '-fuse-ld=lld'" before compiling a
        # single object.
        run: |
          set -eu
          brew install ninja llvm libarchive pkg-config go make lld || true
          command -v meson && meson --version

          LLVM_BIN="$(brew --prefix llvm)/bin"
          LLD="$(command -v ld.lld || true)"
          if [ -z "$LLD" ] && [ -x "$(brew --prefix lld)/bin/ld.lld" ]; then
            LLD="$(brew --prefix lld)/bin/ld.lld"
          fi
          if [ -n "$LLD" ]; then
            ln -sf "$LLD" "$LLVM_BIN/ld.lld"
            echo "ld.lld -> $LLD"
            "$LLVM_BIN/clang" --version | head -1
          else
            echo "::error::no ld.lld found; iSH VDSO will not link"
            exit 1
          fi

      - name: Install ldid
        # `ldid` (2.1.5, saurik's) is built without usable CMS output 鈥?it signs,
        # exits 0, and writes a superblob with no CMS slot, so CoreTrust has
        # nothing to evaluate and the app dies at launch. `ldid-procursus` is the
        # fork that writes the fake chain, and it is the one packaged binaries
        # are expected to use.
        #
        # The self-test runs here, two minutes in, rather than after the build.
        run: |
          set -euo pipefail
          brew install ldid-procursus || true

          LDID=""
          for candidate in \
            /opt/homebrew/opt/ldid-procursus/bin/ldid \
            /opt/homebrew/bin/ldid \
            /usr/local/bin/ldid; do
            if [ -x "$candidate" ]; then LDID="$candidate"; break; fi
          done
          test -n "$LDID" || { echo "::error::no ldid found"; exit 1; }
          echo "ldid: $LDID ($("$LDID" 2>&1 | head -1))"

          # Prove it signs at all. It is NOT required to produce a CMS: `ldid -S`
          # writes an ad-hoc signature with no CMS blob by design, and that is
          # the normal shape for a TrollStore package. This reports which shape
          # came out; treating "no CMS" as fatal blocked two builds on a premise
          # that turned out to be false.
          cp /bin/echo /tmp/ldid-probe
          "$LDID" -Sentitlements/Minis-TrollStore.entitlements /tmp/ldid-probe
          python3 scripts/sig_probe.py /tmp/ldid-probe || true
          rm -f /tmp/ldid-probe
          echo "::notice::ldid available: $LDID"

      - name: Disk headroom
        run: df -h / /Users/runner

      - name: Metal toolchain
        # FFmpeg's configure probes for `metal`; without it the
        # yadif_videotoolbox deinterlace filter is silently dropped.
        run: |
          xcodebuild -downloadComponent MetalToolchain || \
            echo "::warning::MetalToolchain download failed 鈥?FFmpeg loses yadif_videotoolbox"
          xcrun -sdk iphoneos metal --version || true

      - name: Cache native deps
        uses: actions/cache@v4
        id: deps-cache
        with:
          path: |
            deps/lame-build
            deps/frameworks
            deps/libs
            deps/include
            deps/resources
          key: deps-${{ runner.os }}-${{ hashFiles('deps/build_*.sh', 'deps/prepare_alpine_rootfs.sh', 'deps/ish/**', 'deps/proot/**') }}

      - name: Build LAME
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: ./deps/build_lame.sh

      - name: Build FFmpeg
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: ./deps/build_ffmpeg.sh

      - name: Build iSH
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: ./deps/build_ish.sh

      - name: Prepare Alpine rootfs
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: ./deps/prepare_alpine_rootfs.sh

      - name: Build rclone xcframework
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: ./deps/build_rclone_ios.sh

      - name: Verify native deps
        run: |
          set -eu
          test -f deps/lame-build/lib/libmp3lame.a      || { echo "::error::lame missing"; exit 1; }
          test -d deps/frameworks/FFmpeg.framework      || { echo "::error::ffmpeg missing"; exit 1; }
          test -d deps/libs                              || { echo "::error::ish libs missing"; exit 1; }
          test -f deps/resources/alpine-rootfs.zip      || { echo "::error::rootfs missing"; exit 1; }
          test -d deps/frameworks/Rclone.xcframework    || { echo "::error::rclone missing"; exit 1; }
          echo "all native deps present"

      # ---------------------------------------------------------------------
      # Runtime helpers: bash, the multicall coreutils host, and the signer.
      # These are the pieces MT-Agent ships that make the environment real.
      # ---------------------------------------------------------------------
      - name: Fetch runtime helpers from MT-Agent
        run: |
          set -eu
          MT_VERSION="${{ inputs.mt_version || '1.0.5' }}"
          BASE="https://github.com/susu123oss/MT-Agent/releases/download/${MT_VERSION}"
          # Asset naming drifted between releases: 1.0.5 ships -Lite.tipa,
          # 1.0.6 ships -Lite.1.tipa. Try both rather than pin a guess.
          for name in "MT-Agent-v${MT_VERSION}-Lite.tipa" "MT-Agent-v${MT_VERSION}-Lite.1.tipa"; do
            if curl -fL --retry 2 -o /tmp/mt.tipa "${BASE}/${name}"; then
              echo "fetched ${name}"
              break
            fi
          done
          test -s /tmp/mt.tipa || { echo "::error::could not download MT-Agent helpers"; exit 1; }
          rm -rf /tmp/mt && mkdir -p /tmp/mt
          unzip -q /tmp/mt.tipa -d /tmp/mt
          # Staged OUTSIDE the synchronized source group: these are extensionless
          # arm64 binaries, and a synchronized group would try to treat them as
          # build inputs. They are copied into the built .app instead.
          rm -rf runtime-helpers && mkdir -p runtime-helpers
          cp -a /tmp/mt/Payload/CodexApp.app/Helpers/. runtime-helpers/
          rm -rf runtime-helpers/TheosCompat runtime-helpers/TheosCoreCompat
          test -x runtime-helpers/bash.real    || { echo "::error::bash.real missing"; exit 1; }
          test -x runtime-helpers/ca-filetool  || { echo "::error::ca-filetool missing"; exit 1; }
          test -x runtime-helpers/codex-sign   || { echo "::error::codex-sign missing"; exit 1; }
          ls -l runtime-helpers | head -40

      - name: Apply the runtime-host graft
        run: |
          set -eu
          python3 patches/patch_minis.py --repo .
          # entitlements: platform-application makes the bundle TrollStore-only
          cp entitlements/Minis-TrollStore.entitlements src/ios/Minis.entitlements
          echo "--- patched tree ---"
          ls -la src/ios/RuntimeHost
          grep -n "native-runtime-graft" src/ios/Agent/ISH/ISHExecutionCoordinator.swift | head -3

      - name: Build app (unsigned)
        # PRODUCT_BUNDLE_IDENTIFIER is deliberately NOT overridden. The app group
        # (group.com.openminis.app), the iCloud container and the four embedded
        # extension identities all derive from com.openminis.app; changing the
        # app id alone leaves the extensions pointing at a parent that no longer
        # exists and the embed phase fails validation.
        run: |
          set -euo pipefail
          mkdir -p build
          XCB_LOG="build/xcodebuild.log"

          # The exit status is captured rather than propagated immediately.
          # `xcodebuild | tee | tail` has produced a non-zero status after
          # printing ** BUILD SUCCEEDED ** on this runner, and under `set -e`
          # that killed the step with no output at all 鈥?indistinguishable from a
          # real compile failure. Capture it, report it, then decide using the
          # artifact and the log rather than trusting one number.
          set +e
          xcodebuild \
            -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DD \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            ${DEPLOYMENT_OVERRIDE:-} \
            build 2>&1 | tee "$XCB_LOG" | tail -60
          xcb_status=$?
          set -e
          echo "xcodebuild pipeline exit: $xcb_status"

          # `find -print -quit`, not `find | head -1`: under pipefail the pipe
          # reports SIGPIPE from find and kills the step.
          APP=$(find build/DD/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -print -quit)

          if [ "$xcb_status" -ne 0 ] || [ -z "$APP" ] || [ ! -f "$APP/Info.plist" ]; then
            echo "::error::build did not produce a usable bundle (exit=$xcb_status app='$APP')"
            grep -nE "(^| )error:|\*\* BUILD FAILED" "$XCB_LOG" | sed -n '1,25p' || true
            [ -n "$APP" ] && ls -1 "$APP" | sed -n '1,30p' || true
            exit 1
          fi

          echo "APP=$APP" >> $GITHUB_ENV
          echo "built: $APP"
          du -sh "$APP"
          df -h /Users/runner | tail -1

      - name: Package .tipa
        run: |
          set -eu
          # Helpers land in the bundle now, after the build, so Xcode never sees
          # them as inputs. The app looks for Bundle/Helpers/bash at runtime.
          mkdir -p "$APP/Helpers"
          cp -a runtime-helpers/. "$APP/Helpers/"
          chmod +x "$APP/Helpers/bash.real" "$APP/Helpers/ca-filetool" "$APP/Helpers/codex-sign"
          for link in "$APP/Helpers"/*; do
            [ -L "$link" ] || continue
            target=$(readlink "$link")
            echo "symlink $(basename "$link") -> $target"
          done
          test -x "$APP/Helpers/bash" || { echo "::error::Helpers/bash not resolvable"; exit 1; }

          python3 scripts/make_tipa.py \
            --app "$APP" \
            --entitlements entitlements/Minis-TrollStore.entitlements \
            --out "dist/Minis-nativeenv-${GITHUB_SHA::7}.tipa"

      - name: Report the signature shape
        # Informational, not a gate. `ldid -S` produces an ad-hoc signature with
        # no CMS blob, and that is the normal shape for a TrollStore package 鈥?        # an earlier revision treated the absence of a CMS as the cause of a
        # launch crash and blocked two builds on a wrong premise. The check is
        # still worth printing: it distinguishes "signed at all" from "not
        # signed", which is a real failure.
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/sig_probe.py dist/*.tipa || true

      - name: Report
        run: |
          set -eu
          ls -lh dist/
          python3 - <<'PY'
          import glob, hashlib, os
          for p in sorted(glob.glob("dist/*.tipa")):
              h = hashlib.sha256(open(p,"rb").read()).hexdigest()
              print(f"{os.path.basename(p)}  {os.path.getsize(p)/1e6:.1f} MB  sha256={h}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: minis-nativeenv-tipa
          path: dist/*.tipa
          retention-days: 30
          if-no-files-found: error

      - name: Keep build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          retention-days: 7

